[env:esp32dev]
; Pinned to the Arduino-ESP32 2.x core (stable esp_task_wdt API); the
; espressif32@6.x platform family tracks that core.
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    -std=gnu++17
