name: powerguard_iot
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.5
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.1
  flutter_foreground_task: ^8.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon_source.png"
  adaptive_icon_background: "#0A2540" # Darker blue to match the provided image
  adaptive_icon_foreground: "assets/app_icon_source.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/sounds/navy_overpressure_al.mp3
